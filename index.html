<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathwork Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              glow: '0 0 45px rgba(56, 189, 248, 0.25)',
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        font-family: 'Inter', sans-serif;
        background: #020617;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root" class="min-h-screen"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-type="module">
      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const getNow = () => {
        if (typeof performance !== 'undefined') return performance.now();
        return Date.now();
      };

      const PHASES = [
        { key: 'inhale', label: 'Inhale' },
        { key: 'holdTop', label: 'Hold (Full)' },
        { key: 'exhale', label: 'Exhale' },
        { key: 'holdBottom', label: 'Hold (Empty)' },
      ];

      const PRESET_PROGRAMS = [
        {
          id: 'beginner',
          name: 'Beginner Balance',
          description: 'Steady starter cadence',
          pattern: { inhale: 4, holdTop: 4, exhale: 4, holdBottom: 4 },
          minutes: 5,
        },
        {
          id: 'stress',
          name: 'Stress Relief',
          description: 'Gentle downshift focus',
          pattern: { inhale: 4, holdTop: 7, exhale: 8, holdBottom: 0 },
          minutes: 7,
        },
        {
          id: 'intermediate',
          name: 'Intermediate Flow',
          description: 'Expand CO₂ tolerance',
          pattern: { inhale: 5, holdTop: 5, exhale: 5, holdBottom: 5 },
          minutes: 10,
        },
        {
          id: 'advanced',
          name: 'Advanced Retention',
          description: 'Extended exhales & holds',
          pattern: { inhale: 8, holdTop: 8, exhale: 10, holdBottom: 8 },
          minutes: 12,
        },
        {
          id: 'quick',
          name: 'Quick Reset',
          description: 'Fast nervous system reset',
          pattern: { inhale: 3, holdTop: 3, exhale: 3, holdBottom: 3 },
          minutes: 3,
        },
      ];

      const THEMES = [
        {
          id: 'calm',
          name: 'Calm Tide',
          panel: 'from-slate-900 via-slate-950 to-slate-900',
          phaseGradients: {
            inhale: 'from-rose-700 via-red-500 to-orange-400',
            holdTop: 'from-orange-400 via-amber-400 to-rose-500',
            exhale: 'from-orange-400 via-sky-400 to-blue-700',
            holdBottom: 'from-blue-700 via-indigo-800 to-slate-900',
          },
          circleGlow: 'shadow-[0_0_45px_rgba(248,113,113,0.35)]',
        },
        {
          id: 'sunset',
          name: 'Sunset Glow',
          panel: 'from-rose-950 via-slate-950 to-amber-950',
          phaseGradients: {
            inhale: 'from-red-700 via-rose-600 to-orange-400',
            holdTop: 'from-amber-500 via-orange-500 to-rose-600',
            exhale: 'from-orange-400 via-sky-500 to-blue-600',
            holdBottom: 'from-blue-600 via-indigo-700 to-slate-950',
          },
          circleGlow: 'shadow-[0_0_45px_rgba(249,115,22,0.35)]',
        },
        {
          id: 'midnight',
          name: 'Midnight Aurora',
          panel: 'from-slate-950 via-slate-900 to-slate-950',
          phaseGradients: {
            inhale: 'from-rose-800 via-red-600 to-orange-500',
            holdTop: 'from-amber-500 via-rose-500 to-red-600',
            exhale: 'from-orange-500 via-sky-500 to-blue-700',
            holdBottom: 'from-blue-700 via-indigo-800 to-slate-950',
          },
          circleGlow: 'shadow-[0_0_40px_rgba(96,165,250,0.35)]',
        },
      ];

      function useStoredState(key, defaultValue) {
        const [value, setValue] = useState(() => {
          if (typeof window === 'undefined') return defaultValue;
          try {
            const stored = window.localStorage.getItem(key);
            return stored ? JSON.parse(stored) : defaultValue;
          } catch (err) {
            console.warn('Storage read failed', err);
            return defaultValue;
          }
        });

        useEffect(() => {
          if (typeof window === 'undefined') return;
          try {
            window.localStorage.setItem(key, JSON.stringify(value));
          } catch (err) {
            console.warn('Storage write failed', err);
          }
        }, [key, value]);

        return [value, setValue];
      }

      function formatPattern(pattern) {
        return `${pattern.inhale}-${pattern.holdTop}-${pattern.exhale}-${pattern.holdBottom}`;
      }

      function secondsToClock(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.max(0, Math.floor(seconds % 60));
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function secondsToReadable(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        if (mins === 0) return `${secs}s`;
        if (secs === 0) return `${mins}m`;
        return `${mins}m ${secs}s`;
      }

      function BuilderPanel({ initialProgram, onClose, onSave }) {
        const [draftName, setDraftName] = useState(initialProgram?.name || '');
        const [inhale, setInhale] = useState(initialProgram?.pattern?.inhale ?? 4);
        const [holdTop, setHoldTop] = useState(initialProgram?.pattern?.holdTop ?? 4);
        const [exhale, setExhale] = useState(initialProgram?.pattern?.exhale ?? 4);
        const [holdBottom, setHoldBottom] = useState(initialProgram?.pattern?.holdBottom ?? 4);
        const [minutes, setMinutes] = useState(initialProgram?.minutes ?? 5);
        const [error, setError] = useState('');

        useEffect(() => {
          setDraftName(initialProgram?.name || '');
          setInhale(initialProgram?.pattern?.inhale ?? 4);
          setHoldTop(initialProgram?.pattern?.holdTop ?? 4);
          setExhale(initialProgram?.pattern?.exhale ?? 4);
          setHoldBottom(initialProgram?.pattern?.holdBottom ?? 4);
          setMinutes(initialProgram?.minutes ?? 5);
          setError('');
        }, [initialProgram]);

        const updateValue = (setter) => (event) => {
          setter(Number(event.target.value));
        };

        const handleSubmit = (event) => {
          event.preventDefault();
          const values = [inhale, holdTop, exhale, holdBottom];
          if (values.some((value) => value < 2 || value > 30)) {
            setError('Each phase must be between 2 and 30 seconds.');
            return;
          }
          if (minutes < 3 || minutes > 30) {
            setError('Session length must be between 3 and 30 minutes.');
            return;
          }
          onSave({
            id: 'custom',
            name: draftName.trim() || 'Custom Practice',
            description: 'Personalized timing',
            pattern: { inhale, holdTop, exhale, holdBottom },
            minutes,
          });
        };

        return (
          <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 px-4 py-6">
            <form
              onSubmit={handleSubmit}
              className="w-full max-w-xl rounded-3xl border border-white/10 bg-slate-900/85 p-6 backdrop-blur-xl"
            >
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-semibold text-white">Custom Program</h3>
                <button
                  type="button"
                  onClick={onClose}
                  className="rounded-full border border-white/10 bg-black/40 px-3 py-1 text-xs uppercase tracking-wide text-white/70 transition hover:border-sky-400 hover:text-white"
                >
                  Close
                </button>
              </div>
              <p className="mt-2 text-xs text-slate-300">
                Dial in inhale, holds, and exhale (2–30s each). Perfect for gradually extending
                retention.
              </p>

              <div className="mt-6 space-y-4 text-sm text-white/80">
                <div>
                  <label className="text-xs uppercase tracking-wide text-white/60">Name</label>
                  <input
                    value={draftName}
                    onChange={(event) => setDraftName(event.target.value)}
                    placeholder="My Evening Reset"
                    className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                  />
                </div>
                <div className="grid gap-4 md:grid-cols-2">
                  <div>
                    <label className="text-xs uppercase tracking-wide text-white/60">Inhale</label>
                    <input
                      type="number"
                      min="2"
                      max="30"
                      step="1"
                      value={inhale}
                      onChange={updateValue(setInhale)}
                      className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                    />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wide text-white/60">
                      Hold (Full)
                    </label>
                    <input
                      type="number"
                      min="2"
                      max="30"
                      step="1"
                      value={holdTop}
                      onChange={updateValue(setHoldTop)}
                      className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                    />
                  </div>
                </div>
                <div className="grid gap-4 md:grid-cols-2">
                  <div>
                    <label className="text-xs uppercase tracking-wide text-white/60">Exhale</label>
                    <input
                      type="number"
                      min="2"
                      max="30"
                      step="1"
                      value={exhale}
                      onChange={updateValue(setExhale)}
                      className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                    />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wide text-white/60">
                      Hold (Empty)
                    </label>
                    <input
                      type="number"
                      min="2"
                      max="30"
                      step="1"
                      value={holdBottom}
                      onChange={updateValue(setHoldBottom)}
                      className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs uppercase tracking-wide text-white/60">
                    Duration (minutes)
                  </label>
                  <input
                    type="number"
                    min="3"
                    max="30"
                    step="1"
                    value={minutes}
                    onChange={updateValue(setMinutes)}
                    className="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm text-white outline-none transition focus:border-sky-400"
                  />
                </div>
              </div>

              {error && <p className="mt-4 text-xs text-rose-400">{error}</p>}

              <button
                type="submit"
                className="mt-6 w-full rounded-full bg-sky-500 py-3 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
              >
                Save Custom Program
              </button>
            </form>
          </div>
        );
      }

      function App() {
        const [settings, setSettings] = useStoredState('bw-settings', {
          themeId: 'calm',
          audioEnabled: true,
          hapticsEnabled: false,
        });
        const [customProgram, setCustomProgram] = useStoredState('bw-custom-program', null);
        const [onboardingSeen, setOnboardingSeen] = useStoredState('bw-onboarding', false);
        const [screen, setScreen] = useState('home'); // home | session | complete
        const [sessionState, setSessionState] = useState('idle'); // idle | countdown | running | paused | complete
        const [selectedProgram, setSelectedProgram] = useState(null);
        const [countdown, setCountdown] = useState(5);
        const [phaseIndex, setPhaseIndex] = useState(0);
        const [cycleIndex, setCycleIndex] = useState(0);
        const [breathCount, setBreathCount] = useState(0);
        const [sessionStats, setSessionStats] = useState(null);
        const [showSettings, setShowSettings] = useState(false);
        const [showBuilder, setShowBuilder] = useState(false);
        const [now, setNow] = useState(getNow());

        const sessionPlanRef = useRef(null);
        const sessionStartRef = useRef(null);
        const phaseStartRef = useRef(null);
        const pauseAtRef = useRef(null);
        const rafRef = useRef(null);
        const phaseIndexRef = useRef(0);
        const cycleRef = useRef(0);
        const breathCountRef = useRef(0);
        const sessionStateRef = useRef(sessionState);
        const selectedProgramRef = useRef(selectedProgram);
        const audioCtxRef = useRef(null);

        useEffect(() => {
          sessionStateRef.current = sessionState;
        }, [sessionState]);

        useEffect(() => {
          selectedProgramRef.current = selectedProgram;
        }, [selectedProgram]);

        useEffect(() => {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker
              .register('./service-worker.js')
              .catch((err) => console.warn('Service worker registration failed', err));
          }
        }, []);

        const activeTheme = useMemo(() => {
          return THEMES.find((theme) => theme.id === settings.themeId) ?? THEMES[0];
        }, [settings.themeId]);

        const ensureAudioContext = useCallback(() => {
          if (!settings.audioEnabled) return null;
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!audioCtxRef.current) {
            audioCtxRef.current = new Ctx();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
          return audioCtxRef.current;
        }, [settings.audioEnabled]);

        const playChime = useCallback(
          (phaseKey) => {
            if (!settings.audioEnabled) return;
            const ctx = ensureAudioContext();
            if (!ctx) return;

            const frequencies = {
              inhale: 660,
              holdTop: 520,
              exhale: 440,
              holdBottom: 360,
            };
            const frequency = frequencies[phaseKey] ?? 500;
            const nowTime = ctx.currentTime;
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, nowTime);

            gain.gain.setValueAtTime(0.0001, nowTime);
            gain.gain.exponentialRampToValueAtTime(0.2, nowTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, nowTime + 0.45);

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start(nowTime);
            oscillator.stop(nowTime + 0.5);
          },
          [ensureAudioContext, settings.audioEnabled]
        );

        const triggerFeedback = useCallback(
          (phaseKey) => {
            playChime(phaseKey);
            if (settings.hapticsEnabled && navigator.vibrate) {
              const patterns = {
                inhale: [30],
                holdTop: [20, 30],
                exhale: [40],
                holdBottom: [20],
              };
              navigator.vibrate(patterns[phaseKey] ?? [25]);
            }
          },
          [playChime, settings.hapticsEnabled]
        );

        const computeCycles = useCallback((program) => {
          const durations = PHASES.map((phase) => Math.max(0, Number(program.pattern[phase.key]) || 0));
          const sum = durations.reduce((total, value) => total + value, 0);
          const minutes = Number(program.minutes || program.durationMinutes || 5);
          if (sum === 0) return { cycles: 1, totalSeconds: minutes * 60, durations };
          const goalSeconds = Math.max(60, Math.round(minutes * 60));
          const cycles = Math.max(1, Math.round(goalSeconds / sum));
          return {
            cycles,
            totalSeconds: cycles * sum,
            durations,
          };
        }, []);

        const beginSession = useCallback(() => {
          const program = selectedProgramRef.current;
          if (!program) return;
          const plan = computeCycles(program);
          sessionPlanRef.current = {
            ...plan,
            name: program.name,
            pattern: program.pattern,
          };

          sessionStartRef.current = getNow();
          phaseStartRef.current = sessionStartRef.current;
          phaseIndexRef.current = 0;
          cycleRef.current = 0;
          breathCountRef.current = 1;
          setPhaseIndex(0);
          setCycleIndex(0);
          setBreathCount(1);
          setSessionState('running');
          triggerFeedback('inhale');
          setNow(getNow());
        }, [computeCycles, triggerFeedback]);

        const finishSession = useCallback(() => {
          const plan = sessionPlanRef.current;
          const endTime = getNow();
          const elapsedSeconds = sessionStartRef.current
            ? Math.max(1, Math.round((endTime - sessionStartRef.current) / 1000))
            : plan?.totalSeconds ?? 0;
          if (plan) {
            breathCountRef.current = plan.cycles;
            setBreathCount(plan.cycles);
          }
          setSessionStats({
            programName: (selectedProgramRef.current && selectedProgramRef.current.name) || 'Breathwork Session',
            breaths: plan?.cycles ?? breathCountRef.current,
            durationSeconds: plan?.totalSeconds ?? elapsedSeconds,
            actualSeconds: elapsedSeconds,
          });
          setSessionState('complete');
          setScreen('complete');
        }, []);

        const advancePhase = useCallback(() => {
          const plan = sessionPlanRef.current;
          if (!plan) return;
          const durations = plan.durations;
          const totalPhases = durations.length;

          let nextPhase = phaseIndexRef.current + 1;
          let nextCycle = cycleRef.current;

          if (nextPhase >= totalPhases) {
            nextPhase = 0;
            nextCycle += 1;
          }

          if (nextCycle >= plan.cycles) {
            finishSession();
            return;
          }

          phaseIndexRef.current = nextPhase;
          cycleRef.current = nextCycle;
          phaseStartRef.current = getNow();
          setPhaseIndex(nextPhase);
          setCycleIndex(nextCycle);

          if (nextPhase === 0) {
            breathCountRef.current += 1;
            setBreathCount(breathCountRef.current);
          }

          triggerFeedback(PHASES[nextPhase].key);

          if (durations[nextPhase] === 0) {
            requestAnimationFrame(() => advancePhase());
          }
        }, [finishSession, triggerFeedback]);

        useEffect(() => {
          if (sessionState !== 'running') {
            if (rafRef.current) {
              cancelAnimationFrame(rafRef.current);
              rafRef.current = null;
            }
            return;
          }

          const tick = (timestamp) => {
            setNow(timestamp);
            const plan = sessionPlanRef.current;
            if (!plan) return;
            const currentDuration = plan.durations[phaseIndexRef.current] || 0;
            if (!phaseStartRef.current) {
              phaseStartRef.current = timestamp;
            }
            const elapsedSeconds = (timestamp - phaseStartRef.current) / 1000;
            if (currentDuration === 0 || elapsedSeconds >= currentDuration) {
              advancePhase();
            }
            if (sessionStateRef.current === 'running') {
              rafRef.current = requestAnimationFrame(tick);
            }
          };

          rafRef.current = requestAnimationFrame(tick);
          return () => {
            if (rafRef.current) {
              cancelAnimationFrame(rafRef.current);
              rafRef.current = null;
            }
          };
        }, [advancePhase, sessionState]);

        useEffect(() => {
          if (sessionState !== 'countdown') return;
          setCountdown(5);
          const interval = setInterval(() => {
            setCountdown((prev) => {
              if (prev <= 1) {
                clearInterval(interval);
                beginSession();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }, [beginSession, sessionState]);

        const handleStartProgram = useCallback((program) => {
          setSelectedProgram(program);
          setScreen('session');
          setSessionState('countdown');
        }, []);

        const handlePauseToggle = useCallback(() => {
          if (sessionState === 'running') {
            pauseAtRef.current = getNow();
            setSessionState('paused');
            return;
          }
          if (sessionState === 'paused') {
            const nowTime = getNow();
            const pausedFor = pauseAtRef.current ? nowTime - pauseAtRef.current : 0;
            if (pausedFor > 0) {
              if (phaseStartRef.current) phaseStartRef.current += pausedFor;
              if (sessionStartRef.current) sessionStartRef.current += pausedFor;
            }
            setSessionState('running');
            setNow(getNow());
          }
        }, [sessionState]);

        const handleReset = useCallback(() => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          sessionPlanRef.current = null;
          sessionStartRef.current = null;
          phaseStartRef.current = null;
          pauseAtRef.current = null;
          phaseIndexRef.current = 0;
          cycleRef.current = 0;
          breathCountRef.current = 0;
          setPhaseIndex(0);
          setCycleIndex(0);
          setBreathCount(0);
          setSessionState('idle');
          setScreen('home');
          setSelectedProgram(null);
        }, []);

        const handleReplay = useCallback(() => {
          if (!selectedProgramRef.current) return;
          setSessionState('countdown');
          setScreen('session');
        }, []);

        const currentPlan = sessionPlanRef.current;
        const currentPhase = PHASES[phaseIndex] ?? PHASES[0];
        const currentDuration =
          currentPlan && currentPlan.durations ? currentPlan.durations[phaseIndex] || 0 : 0;
        const effectiveNow =
          sessionState === 'paused' && pauseAtRef.current ? pauseAtRef.current : now;
        const elapsedSeconds =
          sessionState !== 'idle' && phaseStartRef.current
            ? Math.max(0, (effectiveNow - phaseStartRef.current) / 1000)
            : 0;
        const clampedElapsed = Math.min(currentDuration || Number.MAX_SAFE_INTEGER, elapsedSeconds);
        const phaseProgress = currentDuration > 0 ? Math.min(1, clampedElapsed / currentDuration) : 1;

        const breathTarget = currentPlan?.cycles ?? 0;
        const totalTargetSeconds = currentPlan?.totalSeconds ?? 0;
        const sessionElapsedSeconds =
          sessionState !== 'idle' && sessionStartRef.current
            ? Math.max(0, ((sessionState === 'paused' && pauseAtRef.current
                  ? pauseAtRef.current
                  : now) - sessionStartRef.current) / 1000)
            : 0;
        const timeRemaining = Math.max(0, totalTargetSeconds - sessionElapsedSeconds);

        const circleScale = useMemo(() => {
          if (phaseProgress >= 1) return 1.3;
          switch (currentPhase.key) {
            case 'inhale':
              return 0.7 + phaseProgress * 0.6;
            case 'holdTop':
              return 1.3;
            case 'exhale':
              return 1.3 - phaseProgress * 0.6;
            case 'holdBottom':
              return 0.7;
            default:
              return 1;
          }
        }, [currentPhase.key, phaseProgress]);

        const currentGradient =
          activeTheme.phaseGradients[currentPhase.key] || 'from-slate-900 via-slate-950 to-slate-900';

        const programCards = useMemo(() => {
          return PRESET_PROGRAMS.map((program) => {
            const plan = computeCycles(program);
            return (
              <button
                key={program.id}
                onClick={() => handleStartProgram(program)}
                className="group relative overflow-hidden rounded-2xl border border-white/5 bg-slate-900/60 p-5 text-left transition-transform hover:-translate-y-1 hover:border-sky-400/60 hover:bg-slate-900/80"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-semibold text-white">{program.name}</h3>
                  <span className="text-xs uppercase tracking-wide text-sky-300">
                    {program.minutes} min
                  </span>
                </div>
                <p className="mt-2 text-sm text-slate-300">{program.description}</p>
                <div className="mt-4 flex items-center justify-between text-xs text-slate-400">
                  <span>{formatPattern(program.pattern)}</span>
                  <span>{plan.cycles} breaths</span>
                </div>
                <div className="pointer-events-none absolute inset-0 bg-gradient-to-br from-sky-500/0 via-sky-400/0 to-sky-400/0 opacity-0 transition-opacity group-hover:opacity-20"></div>
              </button>
            );
          });
        }, [computeCycles, handleStartProgram]);

        const renderHome = () => (
          <div className="mx-auto flex w-full max-w-4xl flex-col gap-10 px-4 py-12">
            <header className="flex items-center justify-between">
              <div>
                <h1 className="text-3xl font-semibold text-white">Breathwork Coach</h1>
                <p className="mt-1 text-sm text-slate-300">
                  Build CO₂ tolerance with progressive box breathing patterns.
                </p>
              </div>
              <button
                onClick={() => setShowSettings(true)}
                className="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-slate-900/70 text-slate-200 transition hover:border-sky-400/50 hover:text-white"
                aria-label="Open settings"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  strokeWidth="1.5"
                  stroke="currentColor"
                  className="h-5 w-5"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    d="M3.75 6.75h16.5m-16.5 5.25h16.5m-16.5 5.25h16.5"
                  />
                </svg>
              </button>
            </header>

            <section>
              <h2 className="text-lg font-medium text-slate-200">Guided Programs</h2>
              <div className="mt-4 grid gap-4 md:grid-cols-2">{programCards}</div>
            </section>

            <section>
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-medium text-slate-200">Custom Builder</h2>
                <button
                  onClick={() => setShowBuilder(true)}
                  className="rounded-full border border-sky-500/40 px-3 py-1 text-xs font-medium text-sky-300 transition hover:border-sky-400 hover:text-sky-200"
                >
                  {customProgram ? 'Edit' : 'Create'}
                </button>
              </div>
              <div className="mt-4 rounded-2xl border border-white/5 bg-slate-900/50 p-5">
                {customProgram ? (
                  <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                    <div>
                      <p className="text-base font-medium text-white">
                        {customProgram.name || 'Custom Practice'}
                      </p>
                      <p className="text-sm text-slate-300">
                        {formatPattern(customProgram.pattern)} · {customProgram.minutes} min ·{' '}
                        {computeCycles(customProgram).cycles} breaths
                      </p>
                    </div>
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => handleStartProgram(customProgram)}
                        className="rounded-full bg-sky-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
                      >
                        Start Custom
                      </button>
                      <button
                        onClick={() => setShowBuilder(true)}
                        className="rounded-full border border-white/10 px-3 py-2 text-xs text-slate-300 transition hover:border-sky-400 hover:text-sky-200"
                      >
                        Adjust
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="flex flex-col gap-3">
                    <p className="text-sm text-slate-300">
                      Set personalized timing (2–30s per phase) and choose a theme you enjoy.
                    </p>
                    <button
                      onClick={() => setShowBuilder(true)}
                      className="self-start rounded-full bg-sky-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
                    >
                      Build Custom Program
                    </button>
                  </div>
                )}
              </div>
            </section>
          </div>
        );

        const renderCountdown = () => (
          <div className="flex flex-1 flex-col items-center justify-center gap-6">
            <p className="text-sm uppercase tracking-[0.3em] text-slate-300">Get Ready</p>
            <div className="text-7xl font-semibold text-white">{countdown}</div>
            <p className="text-sm text-slate-400">Starting {selectedProgram?.name ?? 'session'} in</p>
          </div>
        );

        const renderSession = () => {
          const totalCycles = currentPlan?.cycles ?? 0;
          const cycleLabel = `${cycleIndex + 1} / ${totalCycles || '—'}`;
          const timeLeftLabel =
            totalTargetSeconds > 0 ? secondsToClock(timeRemaining) : secondsToClock(0);
          const phaseLabel = currentPhase.label;
          const tip =
            {
              inhale: 'Fill low, ribs, then chest—smooth and expansive.',
              holdTop: 'Stay relaxed; soften shoulders and jaw.',
              exhale: 'Release slowly, steady and controlled.',
              holdBottom: 'Rest empty. Allow calm to spread.',
            }[currentPhase.key] ?? '';

          return (
            <div
              className={`relative flex flex-1 flex-col overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br ${currentGradient} px-6 py-8 transition-[background] duration-700`}
            >
              <div className="flex items-center justify-between text-sm text-slate-200">
                <div>
                  <p className="text-xs uppercase tracking-wide text-white/70">Program</p>
                  <p className="text-base font-medium text-white">
                    {selectedProgram?.name ?? 'Breath Session'}
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="rounded-full border border-white/20 px-3 py-1 text-xs font-medium text-white/80">
                    Cycle {cycleLabel}
                  </span>
                  <button
                    onClick={handlePauseToggle}
                    className="rounded-full border border-white/30 bg-black/20 px-4 py-2 text-xs font-semibold uppercase tracking-wide text-white/80 transition hover:border-white/50 hover:text-white"
                  >
                    {sessionState === 'paused' ? 'Resume' : 'Pause'}
                  </button>
                </div>
              </div>

              <div className="relative mt-10 flex flex-1 flex-col items-center justify-center">
                <div
                  className={`relative flex h-64 w-64 items-center justify-center rounded-full bg-white/5 transition-transform duration-300 ease-out md:h-80 md:w-80 ${activeTheme.circleGlow}`}
                  style={{ transform: `scale(${circleScale})` }}
                >
                  <div className="h-40 w-40 rounded-full border border-white/10 bg-white/10 blur-3xl"></div>
                  <div className="absolute inset-4 rounded-full border border-white/10 bg-slate-900/20 backdrop-blur-xl"></div>
                </div>

                <div className="mt-10 text-center">
                  <p className="text-sm uppercase tracking-[0.4em] text-white/70">{phaseLabel}</p>
                  <p className="mt-4 text-5xl font-semibold text-white">
                    {currentDuration > 0 ? Math.ceil(Math.max(0, currentDuration - clampedElapsed)) : '—'}
                  </p>
                  <p className="mt-4 text-sm text-slate-200">{tip}</p>
                </div>
              </div>

              <div className="mt-10 grid grid-cols-2 gap-4 text-sm text-white/80 md:grid-cols-4">
                <div className="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <p className="text-xs uppercase tracking-wide text-white/60">Phase Time</p>
                  <p className="mt-1 text-lg font-medium text-white">
                    {currentDuration > 0 ? secondsToClock(currentDuration - clampedElapsed) : '—'}
                  </p>
                </div>
                <div className="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <p className="text-xs uppercase tracking-wide text-white/60">Remaining</p>
                  <p className="mt-1 text-lg font-medium text-white">{timeLeftLabel}</p>
                </div>
                <div className="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <p className="text-xs uppercase tracking-wide text-white/60">Breaths</p>
                  <p className="mt-1 text-lg font-medium text-white">
                    {breathCount} / {breathTarget || '—'}
                  </p>
                </div>
                <div className="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <p className="text-xs uppercase tracking-wide text-white/60">State</p>
                  <p className="mt-1 text-lg font-medium text-white">
                    {sessionState === 'paused' ? 'Paused' : 'Active'}
                  </p>
                </div>
              </div>

              <button
                onClick={handleReset}
                className="mt-10 self-center text-xs uppercase tracking-[0.3em] text-white/60 transition hover:text-white/90"
              >
                End Session
              </button>
            </div>
          );
        };

        const renderSessionScreen = () => (
          <div className="flex min-h-screen flex-col gap-6 bg-gradient-to-b from-slate-950 via-slate-950 to-slate-950 px-4 py-6 md:px-8 md:py-10">
            <button
              onClick={() => (sessionState === 'running' || sessionState === 'paused' ? handleReset() : setScreen('home'))}
              className="self-start rounded-full border border-white/10 bg-slate-900/60 px-4 py-2 text-xs font-semibold uppercase tracking-wide text-white/80 transition hover:border-sky-400 hover:text-white"
            >
              Back
            </button>
            <div className="mx-auto flex w-full max-w-4xl flex-1 flex-col">
              {sessionState === 'countdown' ? renderCountdown() : renderSession()}
            </div>
          </div>
        );

        const renderCompletion = () => {
          if (!sessionStats) return null;
          return (
            <div className="flex min-h-screen flex-col items-center justify-center bg-slate-950 px-4 py-12">
              <div className="w-full max-w-lg rounded-3xl border border-white/10 bg-slate-900/70 p-8 text-center shadow-glow">
                <p className="text-xs uppercase tracking-[0.4em] text-sky-300">Complete</p>
                <h2 className="mt-3 text-3xl font-semibold text-white">{sessionStats.programName}</h2>
                <p className="mt-3 text-sm text-slate-300">
                  {sessionStats.breaths} steady breaths ·{' '}
                  {secondsToReadable(sessionStats.actualSeconds ?? sessionStats.durationSeconds)}
                </p>
                <div className="mt-8 grid grid-cols-1 gap-4 text-sm text-white/80 md:grid-cols-3">
                  <div className="rounded-2xl border border-white/10 bg-black/30 px-4 py-3">
                    <p className="text-xs uppercase tracking-wide text-white/60">Breaths</p>
                    <p className="mt-1 text-2xl font-semibold text-white">{sessionStats.breaths}</p>
                  </div>
                  <div className="rounded-2xl border border-white/10 bg-black/30 px-4 py-3">
                    <p className="text-xs uppercase tracking-wide text-white/60">Duration</p>
                    <p className="mt-1 text-2xl font-semibold text-white">
                      {secondsToClock(sessionStats.actualSeconds ?? sessionStats.durationSeconds)}
                    </p>
                  </div>
                  <div className="rounded-2xl border border-white/10 bg-black/30 px-4 py-3">
                    <p className="text-xs uppercase tracking-wide text-white/60">Pattern</p>
                    <p className="mt-1 text-base font-medium text-white">
                      {sessionPlanRef.current
                        ? formatPattern(sessionPlanRef.current.pattern)
                        : '—'}
                    </p>
                  </div>
                </div>
                <div className="mt-8 flex flex-col gap-3 md:flex-row md:justify-center">
                  <button
                    onClick={handleReplay}
                    className="rounded-full bg-sky-500 px-5 py-2 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
                  >
                    Replay Session
                  </button>
                  <button
                    onClick={handleReset}
                    className="rounded-full border border-white/10 px-5 py-2 text-sm font-semibold text-white/80 transition hover:border-sky-400 hover:text-white"
                  >
                    Back Home
                  </button>
                </div>
              </div>
            </div>
          );
        };

        const renderSettingsPanel = () => (
          <div className="fixed inset-0 z-30 flex items-center justify-center bg-black/60 px-4 py-6">
            <div className="w-full max-w-lg rounded-3xl border border-white/10 bg-slate-900/80 p-6 backdrop-blur-xl">
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-semibold text-white">Settings</h3>
                <button
                  onClick={() => setShowSettings(false)}
                  className="rounded-full border border-white/10 bg-black/40 px-3 py-1 text-xs uppercase tracking-wide text-white/70 transition hover:border-sky-400 hover:text-white"
                >
                  Close
                </button>
              </div>

              <div className="mt-6 space-y-6 text-sm text-white/80">
                <div className="flex items-center justify-between rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <div>
                    <p className="font-medium text-white">Phase chime</p>
                    <p className="text-xs text-slate-300">Simple bell at each transition.</p>
                  </div>
                  <label className="inline-flex cursor-pointer items-center gap-2">
                    <input
                      type="checkbox"
                      checked={settings.audioEnabled}
                      onChange={(event) =>
                        setSettings((prev) => ({ ...prev, audioEnabled: event.target.checked }))
                      }
                      className="h-0 w-0 opacity-0"
                    />
                    <span
                      className={`relative h-6 w-11 rounded-full transition ${
                        settings.audioEnabled ? 'bg-sky-500' : 'bg-slate-600'
                      }`}
                    >
                      <span
                        className={`absolute top-0.5 h-5 w-5 rounded-full bg-white transition ${
                          settings.audioEnabled ? 'left-5' : 'left-0.5'
                        }`}
                      ></span>
                    </span>
                  </label>
                </div>

                <div className="flex items-center justify-between rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
                  <div>
                    <p className="font-medium text-white">Haptics</p>
                    <p className="text-xs text-slate-300">Soft vibration cue (supported devices).</p>
                  </div>
                  <label className="inline-flex cursor-pointer items-center gap-2">
                    <input
                      type="checkbox"
                      checked={settings.hapticsEnabled}
                      onChange={(event) =>
                        setSettings((prev) => ({ ...prev, hapticsEnabled: event.target.checked }))
                      }
                      className="h-0 w-0 opacity-0"
                    />
                    <span
                      className={`relative h-6 w-11 rounded-full transition ${
                        settings.hapticsEnabled ? 'bg-sky-500' : 'bg-slate-600'
                      }`}
                    >
                      <span
                        className={`absolute top-0.5 h-5 w-5 rounded-full bg-white transition ${
                          settings.hapticsEnabled ? 'left-5' : 'left-0.5'
                        }`}
                      ></span>
                    </span>
                  </label>
                </div>

                <div className="space-y-3">
                  <p className="text-xs uppercase tracking-wide text-white/60">Theme</p>
                  <div className="grid gap-3 md:grid-cols-3">
                    {THEMES.map((theme) => (
                      <button
                        key={theme.id}
                        onClick={() => setSettings((prev) => ({ ...prev, themeId: theme.id }))}
                        className={`rounded-2xl border px-4 py-5 text-left transition hover:border-sky-400/60 hover:text-white ${
                          settings.themeId === theme.id
                            ? 'border-sky-400/70 bg-slate-800/60 text-white'
                            : 'border-white/10 bg-black/20 text-white/70'
                        }`}
                      >
                        <p className="text-sm font-semibold">{theme.name}</p>
                        <div
                          className={`mt-3 h-2 rounded-full bg-gradient-to-r ${theme.panel}`}
                        ></div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );

        return (
          <div className={`relative min-h-screen bg-gradient-to-b ${activeTheme.panel}`}>
            {screen === 'home' && renderHome()}
            {screen === 'session' && renderSessionScreen()}
            {screen === 'complete' && renderCompletion()}
            {showSettings && renderSettingsPanel()}
            {showBuilder && (
              <BuilderPanel
                initialProgram={customProgram}
                onClose={() => setShowBuilder(false)}
                onSave={(program) => {
                  setCustomProgram(program);
                  setShowBuilder(false);
                }}
              />
            )}

            {!onboardingSeen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4">
                <div className="max-w-md rounded-3xl border border-white/10 bg-slate-900/80 p-6 text-center text-slate-200 backdrop-blur-xl">
                  <p className="text-sm">
                    Box breathing balances inhale, gentle holds, and long exhales to calm your nervous
                    system and sharpen focus. Do not use while driving or operating machinery. Stop if
                    dizzy or lightheaded.
                  </p>
                  <button
                    onClick={() => setOnboardingSeen(true)}
                    className="mt-6 rounded-full bg-sky-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
                  >
                    I Understand
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
